name: Build offline maps
on:
  push:
    paths: ['build-request.json']
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [poc, full]
        default: poc
      version:
        type: string
        required: true
      grid_km:
        type: choice
        options: ['10', '15', '20']
        default: '15'
      max_zoom:
        type: choice
        options: ['14', '15', '16']
        default: '16'
permissions:
  contents: write
concurrency:
  group: map-release
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.config.outputs.scope }}
      version: ${{ steps.config.outputs.version }}
      size: ${{ steps.config.outputs.size }}
      zoom: ${{ steps.config.outputs.zoom }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SIZE: ${{ inputs.grid_km }}
          INPUT_ZOOM: ${{ inputs.max_zoom }}
        run: |
          python - <<'PYTHON'
          import json,os,re
          value=json.load(open('build-request.json'))
          value={key:os.environ.get('INPUT_'+key.upper()) or str(value[key]) for key in ('scope','version','size','zoom')}
          assert value['scope'] in ('poc','full') and value['size'] in ('10','15','20') and value['zoom'] in ('14','15','16')
          assert re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9._-]{0,60}',value['version'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,text in value.items(): f.write(key+'='+text+'\n')
          PYTHON
  plan:
    needs: configuration
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        country: [JP, TW]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Plan and extract grid batches
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRY: ${{ matrix.country }}
          SCOPE: ${{ needs.configuration.outputs.scope }}
          VERSION: ${{ needs.configuration.outputs.version }}
          GRID_KM: ${{ needs.configuration.outputs.size }}
          MAX_ZOOM: ${{ needs.configuration.outputs.zoom }}
        run: python pipeline.py plan --country "$COUNTRY" --scope "$SCOPE" --version "$VERSION" --size "$GRID_KM" --zoom "$MAX_ZOOM" --output "matrix-$COUNTRY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.country }}
          path: matrix-*.json
          retention-days: 1
  matrix:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-*
          merge-multiple: true
      - id: collect
        run: |
          python - <<'PY'
          import json,glob,os
          include=[entry for path in sorted(glob.glob('matrix-*.json')) for entry in json.load(open(path))['include']]
          if not include: raise RuntimeError('empty build plan')
          count=(len(include)+127)//128
          include=[{'batches':include[i:i+count]} for i in range(0,len(include),count)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          PY
  build:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r requirements.txt
      - name: Generate and publish immutable PMTiles
        env:
          GH_TOKEN: ${{ github.token }}
          BATCHES: ${{ toJSON(matrix.batches) }}
        run: |
          python - <<'PYTHON'
          import json,os,shutil,pipeline
          from types import SimpleNamespace
          for batch in json.loads(os.environ['BATCHES']):
              pipeline.build(SimpleNamespace(repo=os.environ['GITHUB_REPOSITORY'],work='work',batch=batch['batch'],source_tag=batch['sourceTag']))
              shutil.rmtree('work')
          PYTHON
  manifest:
    needs: [build, configuration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate and activate complete manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.configuration.outputs.version }}
          SCOPE: ${{ needs.configuration.outputs.scope }}
        run: |
          python pipeline.py assemble --version "$VERSION" --scope "$SCOPE" --output manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json generation-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified map manifest $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
